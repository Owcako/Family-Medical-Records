<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title desc">
<title id="title">Frontend / import and recovery interactions</title><desc id="desc">React owns drafts and presentation. Backend receipts and polling own what may be presented as stored or filed. Node IDs match architecture comments in the implementation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text {font-family: 'Segoe UI', Arial, sans-serif; fill:#203c36;} .code {font-family: Consolas, monospace; font-size:12px;fill:#61736d;} .body {font-size:16px;} .id {font-size:12px;font-weight:700;letter-spacing:1px;fill:#376b55;} .label {font-size:13px;fill:#61736d;}</style>
<rect width="100%" height="100%" fill="#f8faf7"/>
<text x="40" y="44" font-size="12" letter-spacing="2" fill="#376b55">MEDICAL ACTIVITY TRACKER / IMPLEMENTED DRAFT</text>
<text x="40" y="84" font-size="30" font-weight="600">Frontend / import and recovery interactions</text>
<text x="40" y="113" font-size="15" fill="#61736d">React owns drafts and presentation. Backend receipts and polling own what may be presented as stored or filed.</text>
<g id="U1" data-node="U1" data-x="40" data-y="145" data-width="350" data-height="165"><rect x="40" y="145" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="60" y="169" class="id">U1</text><text x="60" y="196" font-size="20" font-weight="600">Select existing files</text><text x="60" y="215" class="code">ImportPanel.pick / file onChange</text><text x="60" y="236" class="body">Standard photo/PDF/text file picker</text><text x="60" y="260" class="body">One operation key per independent file</text></g>
<g id="U2" data-node="U2" data-x="465" data-y="145" data-width="350" data-height="165"><rect x="465" y="145" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="485" y="169" class="id">U2</text><text x="485" y="196" font-size="20" font-weight="600">Compose a new text draft</text><text x="485" y="215" class="code">ImportPanel state / explicit Save</text><text x="485" y="236" class="body">Keep unsaved title and text locally</text><text x="485" y="260" class="body">No API submission before Save</text></g>
<g id="U3" data-node="U3" data-x="40" data-y="370" data-width="350" data-height="165"><rect x="40" y="370" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="60" y="394" class="id">U3</text><text x="60" y="421" font-size="20" font-weight="600">Processing disclosure</text><text x="60" y="440" class="code">ImportPanel.submit; App.consent</text><text x="60" y="461" class="body">Compare service revision in sessionStorage</text><text x="60" y="485" class="body">Cancel keeps the action unsubmitted</text></g>
<g id="U4" data-node="U4" data-x="465" data-y="370" data-width="350" data-height="165"><rect x="465" y="370" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="485" y="394" class="id">U4</text><text x="485" y="421" font-size="20" font-weight="600">Submit through shared HTTP</text><text x="485" y="440" class="code">api.request; ImportPanel.submit</text><text x="485" y="461" class="body">Consent + stable operation keys</text><text x="485" y="485" class="body">Backend errors stay visible and retryable</text></g>
<g id="U5" data-node="U5" data-x="890" data-y="370" data-width="350" data-height="165"><rect x="890" y="370" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="910" y="394" class="id">U5</text><text x="910" y="421" font-size="20" font-weight="600">Apply confirmed state</text><text x="910" y="440" class="code">App.updated / refresh</text><text x="910" y="461" class="body">Use mutation receipts; poll every 1.8 s</text><text x="910" y="485" class="body">Stored, failed, and filed stay distinct</text></g>
<g id="U6" data-node="U6" data-x="890" data-y="595" data-width="350" data-height="165"><rect x="890" y="595" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="910" y="619" class="id">U6</text><text x="910" y="646" font-size="20" font-weight="600">Browse and inspect evidence</text><text x="910" y="665" class="code">App grouping; Viewer / PdfSource</text><text x="910" y="686" class="body">Four dimensions over the same file IDs</text><text x="910" y="710" class="body">PDF.js pages/zoom; originals and flags</text></g>
<g id="U11" data-node="U11" data-x="465" data-y="595" data-width="350" data-height="165"><rect x="465" y="595" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="485" y="619" class="id">U11</text><text x="485" y="646" font-size="20" font-weight="600">Select / return / navigate</text><text x="485" y="665" class="code">App.select / hash / leave</text><text x="485" y="686" class="body">Stable file link; retain browse filters</text><text x="485" y="710" class="body">Warn before abandoning unsaved edits</text></g>
<g id="U7" data-node="U7" data-x="40" data-y="595" data-width="350" data-height="165"><rect x="40" y="595" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="60" y="619" class="id">U7</text><text x="60" y="646" font-size="20" font-weight="600">Save a manual correction</text><text x="60" y="665" class="code">Viewer.beginEdit / save -&gt; PUT /manual</text><text x="60" y="686" class="body">Capture editor revision; polling keeps draft</text><text x="60" y="710" class="body">Failed Save retains the local draft</text></g>
<g id="U8" data-node="U8" data-x="40" data-y="820" data-width="350" data-height="165"><rect x="40" y="820" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="60" y="844" class="id">U8</text><text x="60" y="871" font-size="20" font-weight="600">Retry processing</text><text x="60" y="890" class="code">Viewer.retry -&gt; POST /retry</text><text x="60" y="911" class="body">Renew consent when service changes</text><text x="60" y="935" class="body">Reuse the same backend file identity</text></g>
<g id="U9" data-node="U9" data-x="465" data-y="820" data-width="350" data-height="165"><rect x="465" y="820" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="485" y="844" class="id">U9</text><text x="485" y="871" font-size="20" font-weight="600">Delete from app controls</text><text x="485" y="890" class="code">Viewer.remove -&gt; DELETE /files/:id</text><text x="485" y="911" class="body">Confirm named target; await backend</text><text x="485" y="935" class="body">Only then remove it from local views</text></g>
<g id="U10" data-node="U10" data-x="890" data-y="820" data-width="350" data-height="165"><rect x="890" y="820" width="350" height="165" rx="12" fill="#ffffff" stroke="#cddbd1"/><text x="910" y="844" class="id">U10</text><text x="910" y="871" font-size="20" font-weight="600">Manage family profiles</text><text x="910" y="890" class="code">App.saveProfile -&gt; /profiles</text><text x="910" y="911" class="body">Create/correct names and printed aliases</text><text x="910" y="935" class="body">Refresh profiles after confirmed save</text></g>
<polyline points="215,310 215,370" fill="none" stroke="#376b55" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="640,310 640,340 260,340 260,370" fill="none" stroke="#376b55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="328" class="label" style="paint-order:stroke;stroke:#f8faf7;stroke-width:6;stroke-linejoin:round">Save</text>
<polyline points="390,452 465,452" fill="none" stroke="#376b55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="401" y="437" class="label" style="paint-order:stroke;stroke:#f8faf7;stroke-width:6;stroke-linejoin:round">accept</text>
<polyline points="815,452 890,452" fill="none" stroke="#376b55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="827" y="437" class="label" style="paint-order:stroke;stroke:#f8faf7;stroke-width:6;stroke-linejoin:round">receipt</text>
<polyline points="1065,535 1065,595" fill="none" stroke="#376b55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1080" y="570" class="label" style="paint-order:stroke;stroke:#f8faf7;stroke-width:6;stroke-linejoin:round">saved state</text>
<polyline points="890,677 815,677" fill="none" stroke="#376b55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="830" y="662" class="label" style="paint-order:stroke;stroke:#f8faf7;stroke-width:6;stroke-linejoin:round">select</text>
<polyline points="465,677 390,677" fill="none" stroke="#376b55" stroke-width="2" marker-end="url(#arrow)"/>
<text x="407" y="662" class="label" style="paint-order:stroke;stroke:#f8faf7;stroke-width:6;stroke-linejoin:round">edit</text>
<polyline points="1240,710 1260,710 1260,790 215,790 215,820" fill="none" stroke="#376b55" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="1040" y="783" class="label" style="paint-order:stroke;stroke:#f8faf7;stroke-width:6;stroke-linejoin:round">processing failed</text>
<text x="40" y="1060" font-size="14" fill="#61736d">U7-U10 send their explicit mutations through U4; U5 applies the actual result and refreshes the shared views.</text>
<text x="40" y="1085" font-size="14" fill="#61736d">Original/initial text remain separate from editor drafts. Source reads use the same file identity.</text>
<text x="40" y="1110" font-size="14" fill="#61736d">Current draft: no chat integration or Recheck action. The diagrams do not represent future PRD behavior as implemented.</text>
</svg>
